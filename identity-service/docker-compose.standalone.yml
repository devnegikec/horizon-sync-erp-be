# Standalone Docker Compose for Identity Service
# Use this for developing/testing identity-service in isolation
# For full stack, use the root docker-compose.yml instead

services:
  postgres:
    image: postgres:18-alpine
    container_name: identity_postgres_standalone
    environment:
      POSTGRES_USER: horizon_user
      POSTGRES_PASSWORD: horizon_pass
      POSTGRES_DB: horizon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon_user -d horizon_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity_standalone_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity_api_standalone
    environment:
      DATABASE_URL: postgresql://horizon_user:horizon_pass@postgres:5432/horizon_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-characters}
      DEBUG: ${DEBUG:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-4320}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4200}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    command: >
      bash -c "
        sleep 5 &&
        python -m alembic upgrade head &&
        python scripts/seed_data.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - identity_standalone_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  identity_standalone_network:
    driver: bridge

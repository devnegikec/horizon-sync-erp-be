repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: local
    hooks:
    -   id: pytest
        name: pytest
        entry: bash -c "cd identity-service && docker compose exec -T api pytest"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

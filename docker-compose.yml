# Horizon Sync Backend — Local stack (identity + core + database)
#
# A single local Postgres container hosts three databases — core_db, identity_db
# and search_db — created by scripts/init_railway.sql on a fresh volume.
#
# Switch between LOCAL and REMOTE database by changing DATABASE_URL in the
# root .env file — no other change needed:
#   LOCAL core:     postgresql://horizon_user:horizon_pass@postgres:5432/core_db
#   LOCAL identity: postgresql://horizon_user:horizon_pass@postgres:5432/identity_db
#   REMOTE:         postgresql://postgres:<password>@roundhouse.proxy.rlwy.net:12893/railway
#
# Start:  docker compose up -d --build

services:
  # ===========================================
  # INFRASTRUCTURE
  # ===========================================
  postgres:
    image: postgres:18-alpine
    container_name: horizon_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-horizon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-horizon_pass}
      # `postgres` is the built-in maintenance DB. The real databases
      # (core_db + identity_db + search_db) live in THIS ONE container and are
      # created by init_railway.sql / the sync script — no second container needed.
      POSTGRES_DB: postgres
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init_railway.sql:/docker-entrypoint-initdb.d/01_init_railway.sql
    healthcheck:
      # Verify the service databases actually exist (created by init_railway.sql),
      # so dependent services don't start and fail later.
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-horizon_user} -d core_db && pg_isready -U ${DB_USER:-horizon_user} -d identity_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - horizon_network

  redis:
    image: redis:7-alpine
    container_name: horizon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - horizon_network
    restart: unless-stopped

  # ===========================================
  # IDENTITY SERVICE (Auth & User Management)
  # ===========================================
  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: horizon_identity
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/identity_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-characters}
      PYDEVD_DISABLE_FILE_VALIDATION: "1"
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-4320}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PASSWORD_RESET_TOKEN_EXPIRE_HOURS: ${PASSWORD_RESET_TOKEN_EXPIRE_HOURS:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4201,http://localhost:4200,http://localhost:4300,http://localhost:3000,http://localhost:3001}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-devnegikec@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-vcgifurrghszmncr}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-devnegikec@gmail.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HorzonSync}
      SMTP_VALIDATE_CERTS: ${SMTP_VALIDATE_CERTS:-false}
      # Core Service Integration
      CORE_SERVICE_URL: http://core-service:8001
      CORE_SERVICE_TIMEOUT: 10
      CORE_SERVICE_SECRET: ${CORE_SERVICE_SECRET:-dev-internal-secret-testing}
      ENABLE_AUTO_CHART_CREATION: ${ENABLE_AUTO_CHART_CREATION:-true}
      CHART_CREATION_RETRY_ATTEMPTS: 3

    ports:
      - "8000:8000"
      - "5678:5678"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./identity-service/app:/app/app
      - ./identity-service/alembic:/app/alembic
      - ./identity-service/scripts:/app/scripts
    command: >
      bash -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Normalizing Identity Service alembic version...' &&
        python scripts/normalize_alembic_version.py &&
        echo 'Running Identity Service migrations...' &&
        (python -m alembic upgrade head || echo 'WARNING: migrations had issues') ;
        echo 'Starting Identity Service with Debugger...' &&
        python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - horizon_network
    restart: unless-stopped

  # ===========================================
  # CORE SERVICE (Inventory, Orders, Billing)
  # ===========================================
  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: horizon_core
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/core_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-characters}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      IDENTITY_SERVICE_URL: http://identity-service:8000
      INTERNAL_SERVICE_SECRET: ${CORE_SERVICE_SECRET:-dev-internal-secret-testing}
      IDENTITY_DATABASE_URL: ${IDENTITY_DATABASE_URL:-postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/identity_db}
      SKIP_MASTER_ORG_SETUP: ${SKIP_MASTER_ORG_SETUP:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-search:events}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_QR_QUEUE_NAME: ${CELERY_QR_QUEUE_NAME:-qr-generation}
      CELERY_DEFAULT_QUEUE_NAME: ${CELERY_DEFAULT_QUEUE_NAME:-core-tasks}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-7200}
      BULK_PUTAWAY_SYNC_THRESHOLD: ${BULK_PUTAWAY_SYNC_THRESHOLD:-20}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4201,http://localhost:4200,http://localhost:4300,http://localhost:3000,http://localhost:3001}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-devnegikec@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-vcgifurrghszmncr}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-devnegikec@gmail.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HorzonSync}
      SMTP_VALIDATE_CERTS: ${SMTP_VALIDATE_CERTS:-false}
      BRAND_KEY_ENCRYPTION_SECRET: ${BRAND_KEY_ENCRYPTION_SECRET:-3GQ2g9v0Qm1x3vJm9q0c8sQ2xJ5xv9k8aYv4lq3n2hA=}
      QR_DOMAIN: ${QR_DOMAIN:-verify.example.com}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-south-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "8001:8001"
      - "5679:5679"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    volumes:
      - ./core-service/app:/app/app
      - ./core-service/alembic:/app/alembic
      - ./core-service/scripts:/app/scripts
      - ./core-service/tests:/app/tests
      - ./core-service/htmlcov:/app/htmlcov
      - ./core-service/create_master_organization.py:/app/create_master_organization.py
    command: >
      bash -c "
        echo 'Waiting for Identity Service...' &&
        sleep 10 &&
        echo 'Running Core Service migrations...' &&
        python scripts/normalize_alembic_version.py &&
        (python -m alembic upgrade heads || echo 'WARNING: migrations had issues') ;
        echo 'Starting Core Service with Debugger...' &&
        python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5679 -m uvicorn app.main:app --host 0.0.0.0 --port 8001
      "
    networks:
      - horizon_network
    restart: unless-stopped

  qr-worker:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: horizon_qr_worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/core_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-characters}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_QR_QUEUE_NAME: ${CELERY_QR_QUEUE_NAME:-qr-generation}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-7200}
      QR_WORKER_CONCURRENCY: ${QR_WORKER_CONCURRENCY:-2}
      BRAND_KEY_ENCRYPTION_SECRET: ${BRAND_KEY_ENCRYPTION_SECRET:-3GQ2g9v0Qm1x3vJm9q0c8sQ2xJ5xv9k8aYv4lq3n2hA=}
      QR_DOMAIN: ${QR_DOMAIN:-verify.example.com}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-south-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-service:
        condition: service_healthy
    volumes:
      - ./core-service/app:/app/app
    command: >
      bash -c "celery -A app.celery_app:celery_app worker --loglevel=$${LOG_LEVEL:-INFO} --queues=$${CELERY_QR_QUEUE_NAME:-qr-generation} --concurrency=$${QR_WORKER_CONCURRENCY:-2}"
    networks:
      - horizon_network
    restart: unless-stopped

  # Generic background worker for non-QR Celery tasks (bulk put-away,
  # transfer reconciliation). QR block generation runs on the dedicated
  # qr-worker above so the two workloads don't contend on one queue.
  core-worker:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: horizon_core_worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/core_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-characters}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_DEFAULT_QUEUE_NAME: ${CELERY_DEFAULT_QUEUE_NAME:-core-tasks}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-7200}
      CORE_WORKER_CONCURRENCY: ${CORE_WORKER_CONCURRENCY:-2}
      BRAND_KEY_ENCRYPTION_SECRET: ${BRAND_KEY_ENCRYPTION_SECRET:-3GQ2g9v0Qm1x3vJm9q0c8sQ2xJ5xv9k8aYv4lq3n2hA=}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-service:
        condition: service_healthy
    volumes:
      - ./core-service/app:/app/app
    command: >
      bash -c "celery -A app.celery_app:celery_app worker --loglevel=$${LOG_LEVEL:-INFO} --queues=$${CELERY_DEFAULT_QUEUE_NAME:-core-tasks} --concurrency=$${CORE_WORKER_CONCURRENCY:-2}"
    networks:
      - horizon_network
    restart: unless-stopped

# ===========================================
# VOLUMES & NETWORKS
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  horizon_network:
    driver: bridge

# Horizon Sync Backend - All Services
# Run all microservices with: docker compose up -d
# Run specific service: docker compose up -d identity-service

services:
  # ===========================================
  # INFRASTRUCTURE
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: horizon_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-horizon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-horizon_pass}
      POSTGRES_DB: ${DB_NAME:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/01_init_databases.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-horizon_user} -d identity_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - horizon_network

  redis:
    image: redis:7-alpine
    container_name: horizon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - horizon_network
    restart: unless-stopped

  # ===========================================
  # IDENTITY SERVICE (Auth & User Management)
  # ===========================================
  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: horizon_identity
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/identity_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-characters}
      PYDEVD_DISABLE_FILE_VALIDATION: "1"
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-4320}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PASSWORD_RESET_TOKEN_EXPIRE_HOURS: ${PASSWORD_RESET_TOKEN_EXPIRE_HOURS:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4201,http://localhost:4200,http://localhost:4300,http://localhost:3000,http://localhost:3001}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-devnegikec@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-yzmfmjpyjsecjqns}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-devnegikec@gmail.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Horizon Sync}
      SMTP_VALIDATE_CERTS: ${SMTP_VALIDATE_CERTS:-true}
      # Core Service Integration
      CORE_SERVICE_URL: http://core-service:8001
      CORE_SERVICE_TIMEOUT: 10
      ENABLE_AUTO_CHART_CREATION: ${ENABLE_AUTO_CHART_CREATION:-true}
      CHART_CREATION_RETRY_ATTEMPTS: 3

    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./identity-service/app:/app/app
      - ./identity-service/alembic:/app/alembic
    command: >
      bash -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running Identity Service migrations...' &&
        python -m alembic upgrade head &&
        echo 'Starting Identity Service with Debugger...' &&
        python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    networks:
      - horizon_network
    restart: unless-stopped

  # ===========================================
  # CORE SERVICE (Inventory, Orders, Billing)
  # ===========================================
  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: horizon_core
    environment:
      DATABASE_URL: postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/core_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-characters}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      IDENTITY_SERVICE_URL: http://identity-service:8000
      IDENTITY_DATABASE_URL: postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/identity_db
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM_NAME: search:events
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4201,http://localhost:4200,http://localhost:4300,http://localhost:3000,http://localhost:3001}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-devnegikec@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-yzmfmjpyjsecjqns}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-devnegikec@gmail.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Horizon Sync ERP}
      SMTP_VALIDATE_CERTS: ${SMTP_VALIDATE_CERTS:-true}
      BRAND_KEY_ENCRYPTION_SECRET: ${BRAND_KEY_ENCRYPTION_SECRET:-Yr1YFHliTgZOGBrdxQwSsYtIW7u18R0CY-kZSRfXpF0=}
    ports:
      - "8001:8001"
      - "5679:5679"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
    volumes:
      - ./core-service/app:/app/app
      - ./core-service/alembic:/app/alembic
      - ./core-service/scripts:/app/scripts
      - ./core-service/tests:/app/tests
      - ./core-service/htmlcov:/app/htmlcov
      - ./core-service/create_master_organization.py:/app/create_master_organization.py
    command: >
      bash -c "
        echo 'Waiting for Identity Service...' &&
        sleep 10 &&
        echo 'Running Core Service migrations...' &&
        python scripts/normalize_alembic_version.py &&
        python -m alembic upgrade head &&
        echo 'Starting Core Service with Debugger...' &&
        python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5679 -m uvicorn app.main:app --host 0.0.0.0 --port 8001
      "
    networks:
      - horizon_network
    restart: unless-stopped

  # ===========================================
  # SEARCH SERVICE (Unified Search API)
  # ===========================================
  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: horizon_search
    environment:
      DATABASE_URL: postgresql://${DB_USER:-horizon_user}:${DB_PASSWORD:-horizon_pass}@postgres:5432/search_db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-characters}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      IDENTITY_SERVICE_URL: http://identity-service:8000
      CORE_SERVICE_URL: http://core-service:8001
      SYNC_SERVICE_USERNAME: ${SYNC_SERVICE_USERNAME:-devendera.negi@gmail.com}
      SYNC_SERVICE_PASSWORD: ${SYNC_SERVICE_PASSWORD:-Test@123}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4201,http://localhost:4200,http://localhost:4300,http://localhost:3000,http://localhost:3001}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS:-1000}
      SEARCH_DEFAULT_PAGE_SIZE: ${SEARCH_DEFAULT_PAGE_SIZE:-20}
    ports:
      - "8002:8002"
      - "5680:5680"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      core-service:
        condition: service_started
    volumes:
      - ./search-service/app:/app/app
      - ./search-service/alembic:/app/alembic
      - ./search-service/tests:/app/tests
    command: >
      bash -c "
        echo 'Waiting for dependencies...' &&
        sleep 15 &&
        echo 'Running Search Service migrations...' &&
        python -m alembic upgrade head &&
        echo 'Starting Search Service with Debugger...' &&
        python -Xfrozen_modules=off -m debugpy --listen 0.0.0.0:5680 -m uvicorn app.main:app --host 0.0.0.0 --port 8002
      "
    networks:
      - horizon_network
    restart: unless-stopped

  # ===========================================
  # API GATEWAY (Nginx — single port for ngrok)
  # ===========================================
  api-gateway:
    build:
      context: ./nginx-gateway
      dockerfile: Dockerfile
    container_name: horizon_gateway
    ports:
      - "9000:9000"
    depends_on:
      - identity-service
      - core-service
      - search-service
    networks:
      - horizon_network
    restart: unless-stopped

# ===========================================
# VOLUMES & NETWORKS
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  horizon_network:
    driver: bridge

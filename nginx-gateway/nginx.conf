upstream identity_service {
    server identity-service:8000;
}

upstream core_service {
    server core-service:8001;
}

upstream search_service {
    server search-service:8002;
}

server {
    listen 9000;
    server_name _;

    # Increase timeouts for slow dev responses
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Max upload size (for attachments, Excel uploads, etc.)
    client_max_body_size 50M;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # =============================================
    # IDENTITY SERVICE  →  /identity/...
    # =============================================
    # Swagger UI & OpenAPI docs
    location /identity/docs {
        proxy_pass http://identity_service/docs;
    }
    location /identity/openapi.json {
        proxy_pass http://identity_service/openapi.json;
    }
    location /identity/redoc {
        proxy_pass http://identity_service/redoc;
    }

    # All Identity API routes
    location /identity/ {
        proxy_pass http://identity_service/;
    }

    # =============================================
    # CORE SERVICE  →  /core/...
    # =============================================
    location /core/docs {
        proxy_pass http://core_service/docs;
    }
    location /core/openapi.json {
        proxy_pass http://core_service/openapi.json;
    }
    location /core/redoc {
        proxy_pass http://core_service/redoc;
    }

    # All Core API routes
    location /core/ {
        proxy_pass http://core_service/;
    }

    # =============================================
    # SEARCH SERVICE  →  /search/...
    # =============================================
    location /search/docs {
        proxy_pass http://search_service/docs;
    }
    location /search/openapi.json {
        proxy_pass http://search_service/openapi.json;
    }
    location /search/redoc {
        proxy_pass http://search_service/redoc;
    }

    location /search/ {
        proxy_pass http://search_service/;
    }

    # =============================================
    # HEALTH CHECK
    # =============================================
    location /health {
        return 200 '{"status":"ok","gateway":"nginx"}';
        add_header Content-Type application/json;
    }

    # Default — show available routes
    location / {
        return 200 '{"routes":{"/identity/":"Identity Service (port 8000)","/core/":"Core Service (port 8001)","/search/":"Search Service (port 8002)","/health":"Gateway health check"}}';
        add_header Content-Type application/json;
    }
}

upstream identity_service {
    server identity-service:8000;
}

upstream core_service {
    server core-service:8001;
}

upstream search_service {
    server search-service:8002;
}

server {
    listen 9000;
    server_name _;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Max upload size
    client_max_body_size 50M;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # =============================================
    # CORS HEADERS — applied to all locations
    # =============================================
    # We handle CORS at the gateway level so backend
    # CORS config doesn't matter for ngrok/remote access.

    # =============================================
    # IDENTITY SERVICE  →  /api/v1/identity/...
    # Routes: login, register, users, roles, etc.
    # =============================================
    location /api/v1/identity/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        proxy_pass http://identity_service/api/v1/identity/;

        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition, Content-Length' always;
    }

    # =============================================
    # SEARCH SERVICE  →  /api/v1/search/...
    # Routes: /search/global, /search/{entity_type}
    # (Must be BEFORE the core catch-all below)
    # =============================================
    location /api/v1/search/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        proxy_pass http://search_service/api/v1/search/;

        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition, Content-Length' always;
    }

    # =============================================
    # CORE SERVICE  →  /api/v1/... (everything else)
    # Routes: items, invoices, payments, warehouses, etc.
    # This is the catch-all for /api/v1/* paths.
    # =============================================
    location /api/v1/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, ngrok-skip-browser-warning' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        proxy_pass http://core_service/api/v1/;

        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Disposition, Content-Length' always;
    }

    # =============================================
    # SWAGGER DOCS — per service
    # =============================================

    # Identity docs
    location = /identity/docs {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '"/openapi.json"' '"/identity/openapi.json"';
        proxy_pass http://identity_service/docs;
    }
    location = /identity/openapi.json {
        proxy_pass http://identity_service/openapi.json;
    }
    location = /identity/redoc {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '"/openapi.json"' '"/identity/openapi.json"';
        proxy_pass http://identity_service/redoc;
    }

    # Core docs
    location = /core/docs {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '"/openapi.json"' '"/core/openapi.json"';
        proxy_pass http://core_service/docs;
    }
    location = /core/openapi.json {
        proxy_pass http://core_service/openapi.json;
    }
    location = /core/redoc {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '"/openapi.json"' '"/core/openapi.json"';
        proxy_pass http://core_service/redoc;
    }

    # Search docs
    location = /search/docs {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '"/openapi.json"' '"/search/openapi.json"';
        proxy_pass http://search_service/docs;
    }
    location = /search/openapi.json {
        proxy_pass http://search_service/openapi.json;
    }
    location = /search/redoc {
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '"/openapi.json"' '"/search/openapi.json"';
        proxy_pass http://search_service/redoc;
    }

    # =============================================
    # HEALTH CHECK
    # =============================================
    location = /health {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # =============================================
    # DEFAULT
    # =============================================
    location / {
        add_header Content-Type application/json;
        return 200 '{"routes":{"api":"/api/v1/* (auto-routed to identity/core/search)","docs":{"/identity/docs":"Identity Swagger","/core/docs":"Core Swagger","/search/docs":"Search Swagger"},"/health":"Gateway health"}}';
    }
}
